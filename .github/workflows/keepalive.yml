name: Engine keepalive

# Wakes the Space engine twice a day so the first visitor of the day does not wait for a cold start, and turns red when the engine is not ready.
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the engine to answer ready
        run: |
          URL=https://ibrahimar397-streams-engine.hf.space/gradio_api/engine/api/health
          for i in $(seq 1 30); do
            body=$(curl -s -m 60 "$URL" || true)
            echo "attempt $i: $body"
            echo "$body" | grep -q '"status":"ready"' && exit 0
            sleep 20
          done
          echo "engine did not become ready" >&2
          exit 1
